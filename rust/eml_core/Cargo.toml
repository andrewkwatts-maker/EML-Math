[package]
name = "eml_core"
version = "2.4.0"
edition = "2021"

[lib]
name = "eml_core"
crate-type = ["cdylib", "rlib"]

[features]
# `python` builds the PyO3 bindings and links against libpython, which is what
# `cargo test` needs: a test binary must resolve the CPython symbols itself.
#
# `extension-module` additionally tells PyO3 to leave those symbols undefined so
# the shared object can be loaded into an interpreter that already provides
# them. ONLY the wheel build (maturin) may turn this on. Folding it into
# `python` -- as this crate previously did, by hard-coding
# `features = ["extension-module"]` on the dependency -- means every
# `#[cfg(test)]` test in the bindings fails to link on Linux and macOS, so the
# tests silently never run. That was a real defect here.
#
# `default` is empty, and that is load-bearing: `eml_core` is a Rust library
# first and must build, test and be depended on with no Python interpreter
# anywhere. It briefly could not -- ~71 ungated `pyo3` references ran through
# `lib.rs`, `knot.rs`, `metric.rs`, `multivector.rs`, `octonion.rs`, `pair.rs`
# and `point.rs`, so emptying this list was an immediate compile error.
#
# What that turned up: every *public* item in the crate was a `#[pyfunction]`.
# The core modules were private, so with the feature off there was no Rust API
# at all. The batch entry points now return `Result<_, InputError>` rather than
# `PyResult`, a single `impl From<InputError> for PyErr` converts at the
# boundary, and the core modules are `pub`.
default = []

python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", optional = true }
rayon = "1.10"
dashmap = "6"

[dev-dependencies]
